<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>镇守府打捞记录簿</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#edf3ff;background:#101b2e}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom)}main{max-width:600px;margin:auto;padding:25px 0 50px}h1{font-size:25px;margin:0 0 5px}small,.muted{color:#9aabc4}select,input,button{font:inherit;border-radius:12px;border:1px solid #34465f;padding:12px;background:#1c2b41;color:#fff}select{width:100%;margin:18px 0}.panel{background:#1a2940;border:1px solid #30435d;border-radius:18px;padding:17px;margin:14px 0}.hero{display:flex;justify-content:space-between;align-items:center}.hero h2{margin:0;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#243650;padding:15px;border-radius:14px}.metric b{display:block;font-size:27px;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{min-height:54px;font-weight:700}.primary{background:#2876cc;border-color:#398be6}.success{background:#188665;border-color:#27a37d;width:100%;margin-top:10px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.line input{width:105px}.progress{height:10px;border-radius:20px;background:#34455d;overflow:hidden}.progress>div{height:100%;background:#59a9ff;width:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar button{flex:1}.danger{color:#ffb6b6}button:active{transform:scale(.98)}#history{line-height:1.8;word-break:break-word}footer{font-size:12px;color:#91a2b9;line-height:1.6}</style></head><body><main><h1>⚓ 镇守府打捞记录簿</h1><small>舰队收藏 · 离线打捞计数器</small><select id="ship"></select><div class="panel hero"><div><small>当前目标</small><h2 id="name"></h2><div class="muted" id="subtitle"></div></div><div style="font-size:46px">⚓</div></div><div class="grid"><div class="metric"><small>累计出击</small><b id="total">0</b></div><div class="metric"><small>Boss S胜</small><b id="s">0</b></div><div class="metric"><small>理论累计出货概率</small><b id="chance">0.0%</b></div><div class="metric"><small>修理桶消耗</small><b id="buckets">0</b></div></div><div class="panel"><div class="line"><b>S胜目标</b><span id="goalLabel"></span></div><div class="progress"><div id="bar"></div></div></div><div class="panel"><h3>记录本次出击</h3><div class="actions"><button class="primary" data-add="S">✓ Boss S胜</button><button data-add="A">Boss A胜</button><button data-add="R">道中撤退</button><button data-add="M">歪航未进Boss</button></div><button class="success" data-add="D" id="drop">✨ 出货啦！</button><small>每轮只点一个结果；出货默认计入一次S胜。</small></div><div class="panel"><h3>作战统计</h3><div id="stats"></div></div><div class="panel"><h3>设置</h3><div class="line"><label for="area">打捞海域</label><input id="area" placeholder="如 3-2"></div><div class="line"><label for="rate">假设S胜掉率 (%)</label><input id="rate" type="number" min="0" max="100" step="0.1"></div><div class="line"><label for="goal">S胜目标</label><input id="goal" type="number" min="1" step="1"></div><div class="line"><span>修理桶</span><div class="toolbar"><button id="minus">−</button><b id="bucketCount">0</b><button id="plus">＋</button></div></div><small>掉率初始值仅用于演示，不代表实时实际掉率。</small></div><div class="panel"><h3>最近出击</h3><div id="history" class="muted">尚无记录</div><div class="toolbar"><button id="undo">↶ 撤销</button><button id="export">导出存档</button><button id="import">导入存档</button></div><input id="file" type="file" accept="application/json,.json" hidden><div class="toolbar" style="margin-top:10px"><button id="reset" class="danger">清空当前舰娘记录</button></div></div><footer>记录自动保存在当前设备浏览器中。建议定期导出备份；清理浏览器网站数据可能删除记录。安装到主屏幕需要通过 HTTPS 网站访问。</footer></main><script>const ships=[['naganami','長波','ながなみ · 夕雲型驱逐舰四番舰','3-2'],['yubari','夕張','ゆうばり · 夕張型轻巡洋舰','4-1'],['hiryu','飛龍','ひりゅう · 飛龍型航空母舰','4-1'],['shinshumaru','神州丸','しんしゅうまる · 陆军特种船','2-3'],['ukuru','鵜来','うくる · 鵜来型海防舰一番舰','1-4'],['tsushima','対馬','つしま · 択捉型海防舰七番舰','1-3'],['kashima','鹿島','かしま · 香取型练习巡洋舰二番舰','']];const $=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem('fleet-counter-v1'))||{}}catch{data={}}function fresh(id){return {records:[],buckets:0,rate:1,goal:100,area:ships.find(x=>x[0]===id)?.[3]||''}}function save(){localStorage.setItem('fleet-counter-v1',JSON.stringify(data))}let active=ships[0][0];function current(){return data[active]||(data[active]=fresh(active))}function render(){let d=current(),meta=ships.find(x=>x[0]===active),r=d.records,s=r.filter(x=>x==='S'||x==='D').length,a=r.filter(x=>x==='A').length,ret=r.filter(x=>x==='R').length,miss=r.filter(x=>x==='M').length,t=r.length,p=Math.max(0,Math.min(100,Number(d.rate)||0))/100;$('name').textContent=meta[1];$('subtitle').textContent=meta[2];$('total').textContent=t;$('s').textContent=s;$('buckets').textContent=d.buckets;$('bucketCount').textContent=d.buckets;$('chance').textContent=(100*(1-(1-p)**s)).toFixed(1)+'%';$('goalLabel').textContent=s+'/'+d.goal;$('bar').style.width=Math.min(100,s/Math.max(1,d.goal)*100)+'%';$('area').value=d.area;$('rate').value=d.rate;$('goal').value=d.goal;$('drop').disabled=r.includes('D');$('drop').textContent=r.includes('D')?'✓ 已捕获':'✨ '+meta[1]+'出货啦！';let pct=(v,den)=>den?(v/den*100).toFixed(1)+'%':'0.0%';$('stats').innerHTML=[['Boss到达率',pct(s+a,t)],['Boss S胜率',pct(s,s+a)],['道中撤退率',pct(ret,t)],['歪航率',pct(miss,t)],['Boss A胜',a+' 次']].map(x=>'<div class="line"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');$('history').textContent=r.length?r.slice(-12).map((v,i)=>`${Math.max(1,r.length-11)+i}. ${{S:'S胜',A:'A胜',R:'撤退',M:'歪航',D:'出货'}[v]}`).join('　'):'尚无记录';save()}ships.forEach(x=>{let o=document.createElement('option');o.value=x[0];o.textContent=x[1];$('ship').append(o)});$('ship').onchange=e=>{active=e.target.value;render()};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{current().records.push(b.dataset.add);render()});$('plus').onclick=()=>{current().buckets++;render()};$('minus').onclick=()=>{current().buckets=Math.max(0,current().buckets-1);render()};$('undo').onclick=()=>{current().records.pop();render()};['area','rate','goal'].forEach(id=>$(id).onchange=e=>{current()[id]=id==='area'?e.target.value:id==='goal'?Math.max(1,Math.floor(Number(e.target.value)||100)):Math.max(0,Math.min(100,Number(e.target.value)||0));render()});$('reset').onclick=()=>{if(confirm('确定清空当前舰娘的出击和修理桶记录吗？')){data[active]=fresh(active);render()}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'fleet-counter-v1',data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='镇守府打捞存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(obj.format!=='fleet-counter-v1'||!obj.data||typeof obj.data!=='object')throw Error('格式不正确');if(!confirm('导入将覆盖现有舰娘记录，继续吗？'))return;for(let id of Object.keys(obj.data)){let d=obj.data[id];if(!Array.isArray(d.records)||!d.records.every(v=>['S','A','R','M','D'].includes(v)))throw Error('记录格式不正确')}data=obj.data;render();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
